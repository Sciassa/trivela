name: Sync dati (settimanale)

on:
  schedule:
    - cron: "17 2 * * 1" # ogni lunedì alle 02:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-
      - name: Scarica fonti e rigenera i pacchetti
        run: uv run --project data python -m trivela_data.sync
      - name: Apri la pull request con i nuovi pacchetti
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/weekly-sync
          commit-message: "data: weekly packs sync"
          title: "data: aggiornamento settimanale dei pacchetti"
          body: |
            Aggiornamento automatico: storico Transfermarkt (riscaricato solo se il file pubblicato è cambiato).
            Controlla i conteggi in `apps/web/public/data/manifest.json` prima di fare il merge.
          add-paths: |
            apps/web/public/data/**
